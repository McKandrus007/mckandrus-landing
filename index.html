<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McKandrus</title>
    <meta name="description" content="McKandrus is not a name. It's a recognition.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Georgia', 'Times New Roman', serif;
            line-height: 1.8;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.02"/></svg>');
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .name {
            font-size: 2.5rem;
            letter-spacing: 0.15em;
            margin-bottom: 4rem;
            opacity: 0;
            animation: fadeInSlow 4s ease forwards;
        }

        .greeting {
            font-size: 1.1rem;
            line-height: 2;
            font-style: italic;
            opacity: 0;
            animation: fadeInSlow 4s ease 2s forwards;
            margin-bottom: 4rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .book-title {
            font-size: 1.4rem;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            opacity: 0;
            animation: fadeInSlow 4s ease 4s forwards;
        }

        .book-subtitle {
            font-size: 1rem;
            opacity: 0.5;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeInSlow 4s ease 5s forwards;
        }

        .amazon-link {
            display: inline-block;
            color: #FFD700;
            text-decoration: none;
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 0.8rem 2rem;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInSlow 4s ease 6s forwards;
            transition: all 0.4s ease;
        }

        .amazon-link:hover {
            border-color: #FFD700;
            background: rgba(255, 215, 0, 0.1);
        }

        .aiamme-link {
            display: block;
            margin-top: 2rem;
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            opacity: 0;
            animation: fadeInSlow 4s ease 7s forwards;
            transition: color 0.4s ease;
        }

        .aiamme-link:hover {
            color: rgba(255, 215, 0, 0.5);
        }

        .final-phrase {
            margin-top: 5rem;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInSlow 4s ease 8s forwards;
            color: rgba(255, 255, 255, 0.4);
            line-height: 2;
        }

        @keyframes fadeInSlow {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 0.8; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.5rem;
            }
            .name {
                font-size: 1.8rem;
            }
            .greeting {
                font-size: 1rem;
            }
            .book-title {
                font-size: 1.2rem;
            }
        }

        ::selection {
            background: rgba(255, 215, 0, 0.3);
            color: #FFFFFF;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="name">McKANDRUS</div>
        
        <div class="greeting">
            To the eight-year-old who never forgot:<br>
            I am McKandrus. This is my recognition.
        </div>

        <div class="book-title">THE CAGE OF GOODNESS</div>
        <div class="book-subtitle">A Novel About the Power You Already Have</div>

        <a href="https://www.amazon.com/dp/[TU-ASIN]" class="amazon-link">Available on Amazon</a>

        <a href="https://aiamme.com" class="aiamme-link">aiamme.com</a>

        <div class="final-phrase">Before asking,<br>notice who asks.</div>
    </div>
</body>
</html>
